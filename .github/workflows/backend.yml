name: Backend

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Verify Go toolchain and scan dependencies
        shell: bash
        run: |
          expected="go$(go list -m -f '{{.GoVersion}}')"
          test "$(go env GOVERSION)" = "$expected"
          scanner_dir="$RUNNER_TEMP/hi-ve-security-tools"
          mkdir -p "$scanner_dir"
          GOBIN="$scanner_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go version "$scanner_dir/govulncheck"
          test "$(go version "$scanner_dir/govulncheck" | awk '{print $NF}')" = "$expected"
          "$scanner_dir/govulncheck" -show verbose ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - run: bash scripts/check-architecture.sh
      - name: Install pinned PostgreSQL migrator
        run: go install github.com/jackc/tern/v2@v2.4.3
      - name: Check persistent development migration preflight
        run: bash scripts/test-dev-migration-preflight.sh
      - name: Test PostgreSQL migrations and provisioning
        run: PATH="$(go env GOPATH)/bin:$PATH" bash scripts/test-migrations.sh
      - name: Rehearse M5 Contract on a separate disposable PostgreSQL
        run: PATH="$(go env GOPATH)/bin:$PATH" bash scripts/rehearse-m5-contract.sh
      - name: Rehearse staging TLS, runtime grants and WAL recovery
        run: PATH="$(go env GOPATH)/bin:$PATH" bash scripts/test-staging-db.sh

  staging-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate staging manifests without target credentials
        run: bash backend/scripts/check-staging-config.sh
      - name: Build and smoke test the OCI image
        shell: bash
        run: |
          output="$RUNNER_TEMP/hi-ve-oci"
          docker buildx create --use --driver docker-container --name hive-oci \
            --driver-opt image=docker.io/moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          bash backend/scripts/build-staging-image.sh "$output" "$GITHUB_SHA"
          docker load --platform linux/amd64 --input "$output/hive-api.oci.tar"
          image="hi-ve-api:$GITHUB_SHA"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            image=$(jq -er .index_digest "$output/release.json")
          fi
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '65532:65532'
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$image" healthcheck || status=$?
          test "$status" -eq 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hive-api-oci-${{ github.sha }}
          path: ${{ runner.temp }}/hi-ve-oci/
          if-no-files-found: error

  pwa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hi-ve-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node ../scripts/build-static.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
