name: Backend

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - run: bash scripts/check-architecture.sh
      - name: Install pinned PostgreSQL migrator
        run: go install github.com/jackc/tern/v2@v2.4.3
      - name: Test PostgreSQL migrations and provisioning
        run: PATH="$(go env GOPATH)/bin:$PATH" bash scripts/test-migrations.sh
